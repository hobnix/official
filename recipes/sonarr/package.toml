# Manifest of a package (docs/PLAN-packages.md). Until the packages move out of this repository the header lines of the
# script still say the same (tests/pkg.sh keeps both in step).
name = "sonarr"
version = "2.0.0"
kind = "recipe"
title = "keeps your series in order: searches new episodes, sends the download to SABnzbd, files it in the library"
title_de = "hält deine Serien in Ordnung: sucht neue Folgen, schickt den Download an SABnzbd, legt ihn in der Bibliothek ab"
requires_core = ">=6"
permissions = ["host:incus", "net:internet", "fs.write:/bulk/shares"]
audience = "generic"
needs = ["docker", "share"]
uses = []
input = "none"
script = "run.sh"
runs = ["lxc", "docker"]

# What this app offers to other packages. The key file is written by run.sh (export_key) from the app's own config, root only.
[integrations.media]
api_url = "http://{host}:{port}"
key_file = "/var/lib/hs/stat-sonarr"
key_header = "X-Api-Key"
kind = "series"
