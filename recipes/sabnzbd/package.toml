# Manifest of a package (docs/PLAN-packages.md).
name = "sabnzbd"
version = "1.2.1"
kind = "recipe"
title = "the Usenet downloader that Radarr and Sonarr send their downloads to"
title_de = "der Usenet-Downloader, an den Radarr und Sonarr ihre Downloads schicken"
requires_core = ">=6"
permissions = ["events.emit:pkg.sabnzbd.*", "host:incus", "net:internet", "fs.write:/bulk/shares"]
audience = "generic"
needs = ["docker", "share"]
uses = []
input = "none"
script = "run.sh"
runs = ["lxc", "docker"]

# Events this package sends (hobnix/core#313; the helper hs-media-notify.py only emits them). Declared here, not in the core.
[[events]]
kind = "added"
level = "info"
retention = "ephemeral"
label = "Download queued"
icon = "download-simple"
meaning = "a download was queued (media helper; subject: the service)"
payload = ["service", "name", "label", "icon", "title", "sub?", "body", "fields?", "footer?", "poster_url?"]
notify = { category = "info", priority = "low", title = "{name}: {label}", message = "{body}" }

[[events]]
kind = "unpacking"
level = "info"
retention = "ephemeral"
label = "Unpacking"
icon = "package"
meaning = "a download is being unpacked (media helper; subject: the service)"
payload = ["service", "name", "label", "icon", "title", "sub?", "body", "fields?", "footer?", "poster_url?"]
notify = { category = "info", priority = "min", title = "{name}: {label}", message = "{body}" }

[[events]]
kind = "finished"
level = "info"
retention = "audit"
label = "Download finished"
icon = "tray-arrow-down"
meaning = "a download finished (media helper; subject: the service)"
payload = ["service", "name", "label", "icon", "title", "sub?", "body", "fields?", "footer?", "poster_url?"]
notify = { category = "ok", priority = "default", title = "{name}: {label}", message = "{body}" }

[[events]]
kind = "failed"
level = "warn"
retention = "audit"
label = "Download failed"
icon = "warning-octagon"
meaning = "a download failed (media helper; subject: the service)"
payload = ["service", "name", "label", "icon", "title", "sub?", "body", "fields?", "footer?", "poster_url?"]
notify = { category = "problem", priority = "high", title = "{name}: {label}", message = "{body}" }

[[events]]
kind = "queue-done"
level = "info"
retention = "ephemeral"
label = "Queue finished"
icon = "checks"
meaning = "the download queue is empty (media helper; subject: the service)"
payload = ["service", "name", "label", "icon", "title", "sub?", "body", "fields?", "footer?", "poster_url?"]
notify = { category = "info", priority = "low", title = "{name}: {label}", message = "{body}" }

[[events]]
kind = "disk-full"
level = "error"
retention = "audit"
label = "Disk full"
icon = "warning-octagon"
meaning = "SABnzbd reports a full disk (media helper; subject: the service)"
payload = ["service", "name", "label", "icon", "title", "sub?", "body", "fields?", "footer?", "poster_url?"]
notify = { category = "alarm", priority = "urgent", title = "{name}: {label}", message = "{body}" }

[[events]]
kind = "error"
level = "warn"
retention = "audit"
label = "Error"
icon = "warning-octagon"
meaning = "SABnzbd reports an error (media helper; subject: the service)"
payload = ["service", "name", "label", "icon", "title", "sub?", "body", "fields?", "footer?", "poster_url?"]
notify = { category = "problem", priority = "high", title = "{name}: {label}", message = "{body}" }

[[events]]
kind = "warning"
level = "info"
retention = "audit"
label = "Warning"
icon = "warning"
meaning = "SABnzbd reports a warning (media helper; subject: the service)"
payload = ["service", "name", "label", "icon", "title", "sub?", "body", "fields?", "footer?", "poster_url?"]
notify = { category = "problem", priority = "default", title = "{name}: {label}", message = "{body}" }

[[events]]
kind = "test"
level = "info"
retention = "ephemeral"
label = "Test"
icon = "check-circle"
meaning = "the test message of SABnzbd (media helper; subject: the service)"
payload = ["service", "name", "label", "icon", "title", "sub?", "body", "fields?", "footer?", "poster_url?"]
notify = { category = "info", priority = "low", title = "{name}: {label}", message = "{body}" }

# What this app offers to other packages. The key file is written by run.sh (export_key) from the app's own config, root only.
[integrations.media]
api_url = "http://{host}:{port}"
key_file = "/var/lib/hs/stat-sabnzbd"
key_header = "X-Api-Key"
kind = "downloader"

[meta]
changes = "docs: fix stale names after the move into one repository"
