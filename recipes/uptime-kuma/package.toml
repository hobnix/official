# Manifest of a package (docs/PLAN-packages.md).
name = "uptime-kuma"
version = "1.0.2"
kind = "recipe"
title = "checks that your services answer, keeps a history and warns when one is down"
title_de = "prüft, ob deine Dienste antworten, führt einen Verlauf und warnt, wenn einer ausfällt"
requires_core = ">=1"
permissions = ["host:incus", "net:internet"]
audience = "generic"
needs = []
uses = []
input = "none"
script = "run.sh"

# The page /apps/uptime-kuma (hobnix/core#424): a status panel, data only. The read `status` is `sys ext uptime-kuma status` of commands.tsv.
[[web.reads]]
words = "status"
kind = "tsv"
ttl = 10
role = "viewer"

[web.page]
title = "Uptime Kuma"
icon = "heartbeat"
crumb = "Apps"
sub = "The state of the instance"
template = "object"

[[web.page.blocks]]
type = "kv"
title = "Instance"
read = "status"
items = [{ k = "State", col = 0 }, { k = "Address", col = 1 }, { k = "Port", col = 2 }]

[meta]
changes = "docs: fix stale names after the move into one repository"
