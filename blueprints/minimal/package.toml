# Blueprint "minimal" (core presets/minimal.toml, docs/PLAN-registry.md "Blueprints"): a plain server. No optional package is chosen; it only
# fills what is not set yet (backupNewShares) and never overwrites a value.
name = "minimal"
version = "1.0.0"
kind = "blueprint"
title = "Minimal"
title_de = "Minimal"
description = "Core only: storage, Samba shares, Incus, the web interface. No optional capability, no proxy, no router connection."
description_de = "Nur der Kern: Speicher, Samba-Freigaben, Incus, Weboberfläche. Keine optionale Fähigkeit, kein Proxy, keine Router-Anbindung."
requires_core = ">=11"
audience = "generic"
roles = ["homeserver", "minimal"]
[blueprint]
capabilities = []
extensions = []
recipes = []

[settings]
backupNewShares = "false"
