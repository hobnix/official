# Blueprint "minimal" (core presets/minimal.toml, docs/PLAN-registry.md "Blueprints"): a plain server. No optional package is chosen; it only
# fills what is not set yet (backupNewShares) and never overwrites a value.
name = "minimal"
version = "1.0.0"
kind = "blueprint"
title = "Minimal"
title_de = "Minimal"
description = "No optional packages: whatever the core ships."
description_de = "Keine optionalen Pakete: nur das, was der Kern mitbringt."
requires_core = ">=11"
audience = "generic"
roles = ["homeserver", "minimal"]
[blueprint]
capabilities = []
extensions = []
recipes = []

[settings]
backupNewShares = "false"
