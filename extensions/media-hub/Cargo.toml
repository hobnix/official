# The poller service of the media hub (hobnix/extensions#27), a static musl program: `[[binary]]` of package.toml, built by scripts/rust-build.sh.
# Copied from examples/rust-hello: the SDK is not published and is pinned to a core release tag; raise both tags together with Cargo.lock
# (`cargo update -p hobnix-pkg -p hobnix-pkg-service`) when the core changes the protocol.
[package]
name = "media-svc"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "media-svc"
path = "src/main.rs"

[dependencies]
# The SDK crates of core 0.14: the base (Ctx, Secret, the plain-http client, integrations, testing::FakeCtx) and the service runner.
hobnix-pkg = { git = "https://github.com/hobnix/core", tag = "v0.14.1" }
hobnix-pkg-service = { git = "https://github.com/hobnix/core", tag = "v0.14.1" }
serde_json = "1"

# Own workspace root: the crate is built by itself, never as part of another folder's workspace.
[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
