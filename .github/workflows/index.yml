# Build, sign and publish the package index of hobnix/official (hobnix/core#1069, #1074). A caller of the shared workflow of the core.
# Not run yet in this shape.
# - push to main: build, sign (environment `index-signing`, main only), publish to GitHub Pages. This is the "release" of official.
# - pull_request: the `build` job only (the `sign` and `publish` jobs have `if: github.ref == 'refs/heads/main'`, so it is skipped), nothing is published.
# - schedule: daily; starts a workflow_dispatch run on main (see below).
# - workflow_dispatch: run it by hand on main (the first signed index, or a re-sign).
#
# Pinned to a full commit SHA of hobnix/core, in every `uses:`, `ref:` and `core_ref` (the reusable workflow checks the core out at that ref and
# verifies the signature against its config/trusted-keys/official.allowed_signers). The `sign` job runs with the signing key: a branch ref would
# let any change merged to the core's develop run with the key without anyone looking at official. Bumping the pin is a reviewed pull request to
# official, and that is how a core change reaches the signing job. check.yml and dco.yml hold no secret and stay on the core's develop.
#
# Why `sign` and `publish` are jobs of THIS file: the environment secret INDEX_SIGNING_KEY did not reach the jobs of a reusable workflow (run
# 45365647291). The reusable workflow only builds (`build`, artifact `index`); the logic of signing stays in the core's composite action index-sign.
#
# Daily run and branch: GitHub starts a `schedule` on the DEFAULT branch (develop here), where `sign` never runs. So the schedule only starts the
# job `daily`, which dispatches this workflow on main (`gh workflow run --ref main`, permission actions: write); that run signs. The `build`
# job itself is skipped on a schedule event.
#
# No `secrets: inherit`: `sign` declares `environment: index-signing` and reads INDEX_SIGNING_KEY from that environment of this repository,
# which only main may use. UNVERIFIED until the first run in this shape.
name: index
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # only to dispatch index.yml on main
    steps:
      - name: Start the index run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run index.yml --ref main --repo "$GITHUB_REPOSITORY"
  build:
    if: github.event_name != 'schedule'
    # pinned: update by a reviewed PR to official, never to a branch
    uses: hobnix/core/.github/workflows/package-index.yml@0e95ea55b789940071e19582337734d0188ebb96
    with:
      repo_id: official
      # pinned: update by a reviewed PR to official, never to a branch
      core_ref: 0e95ea55b789940071e19582337734d0188ebb96
      # GitHub Pages default URL of this repository; replace with the packages.hobnix.dev URL when #1071 is decided
      pages_url: https://packages.hobnix.dev/official
  sign:
    needs: build
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: index-signing
    steps:
      - uses: actions/checkout@v5
        with:
          repository: hobnix/core
          # pinned: update by a reviewed PR to official, never to a branch
          ref: 0e95ea55b789940071e19582337734d0188ebb96
          path: core
      - uses: actions/download-artifact@v4
        with:
          name: index
          path: site
      - uses: ./core/.github/actions/index-sign
        with:
          key: ${{ secrets.INDEX_SIGNING_KEY }}
          repo_id: official
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
  # Alert (hobnix/core#1071): one issue "Index refresh failed" while the daily refresh is broken. Separate jobs with only issues: write, no
  # environment and no access to INDEX_SIGNING_KEY. The schedule run only dispatches (job `daily`); the run that signs is the one on main.
  # UNVERIFIED until a real failing run: not exercised.
  alert-failure:
    needs: [daily, build, sign, publish]
    if: >-
      failure() && github.event_name != 'pull_request' &&
      (github.event_name == 'schedule' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          title="Index refresh failed"
          body="The index run failed (event: $EVENT): $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
  alert-recovered:
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Index refresh failed"
          numbers=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number")
          for number in $numbers; do
            gh issue close "$number" --comment "Fixed: the index run succeeded again: $RUN_URL"
          done
