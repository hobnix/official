name: rust
# A Rust extension or capability ships a static musl program (CONTRIBUTING.md "Writing a package", hobnix/extensions#26, hobnix/core#1129). This job
# builds every crate (`scripts/binary-check.py crates`) twice and fails when the two programs differ, then checks the rules for committed
# programs (scripts/binary-check.py). With no crate in the repository it ends in seconds.
# Not part of the shared release workflow (hobnix/core#522): that one signs and tags; this one needs the crate sources of THIS repository.
on:
  push:
    branches: [develop, main]   # a branch with a pull request runs on `pull_request`
  pull_request:
env:
  CARGO_HTTP_TIMEOUT: "60"
  CARGO_NET_RETRY: "5"
jobs:
  # hobnix/extensions#30: only the release preparation (branch release/prepare-*) and the release (into main) may carry a program.
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No program outside the release preparation
        run: python3 -I scripts/binary-check.py guard --base-branch "$BASE" --head-branch "$HEAD" --base "origin/$BASE" --head "${{ github.event.pull_request.head.sha }}"
        env:
          BASE: ${{ github.base_ref }}
          # a fork cannot claim the release branch name
          HEAD: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || 'fork' }}
  # The pinned Rust version (rust-toolchain.toml, the only place) must exist: a typo or a version never released fails here, not in the release.
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pinned version exists and is the only one
        run: python3 -I scripts/binary-check.py toolchain --online
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # --stale-ok compares with the commit that last changed a program
      - name: Any Rust crate?
        id: crates
        run: |
          list=$(python3 -I scripts/binary-check.py crates)   # on its own line: a failing list must fail the job, not count as 0
          n=$(printf '%s' "$list" | grep -c . || true)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Rust crates: $n"
      - name: Rules for committed programs (no build needed)
        run: python3 -I scripts/binary-check.py check ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && '--release' || '' }}
      - name: Toolchain (pinned in rust-toolchain.toml) and musl
        if: steps.crates.outputs.count != '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup show active-toolchain || rustup toolchain install
          rustc --version && rustup target list --installed
      - name: Cargo cache
        if: steps.crates.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Tests of the crates (unit tests, and the real program against a local http server)
        if: steps.crates.outputs.count != '0'
        run: |
          list=$(python3 -I scripts/binary-check.py crates)
          for c in $list; do
            cargo test --locked --manifest-path "$c/Cargo.toml"
          done
      - name: Build twice and compare (reproducible)
        if: steps.crates.outputs.count != '0'
        run: bash scripts/rust-build.sh --out built
      - name: Committed programs equal the build
        if: steps.crates.outputs.count != '0'
        # On develop (a push, or a pull request into it that is not the release preparation) a program may be older than a changed source:
        # no pull request there may commit one (job guard). The release preparation, the release pull request and main stay strict.
        run: python3 -I scripts/binary-check.py check --built built ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && '--release' || '' }} $STALE
        env:
          STALE: ${{ ((github.event_name == 'pull_request' && github.base_ref == 'develop' && !startsWith(github.head_ref, 'release/prepare-')) || (github.event_name == 'push' && github.ref_name == 'develop')) && '--stale-ok' || '' }}
      - name: Keep the build (what the release preparation commits)
        if: ${{ !cancelled() && steps.crates.outputs.count != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-programs
          path: built
          retention-days: 14
