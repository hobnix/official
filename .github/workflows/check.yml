# Checks of hobnix/official (hobnix/core#1074). Not run yet: this file has never run on GitHub.
# The packages are validated against the core (hobnix/core), which holds pkg.py and the test helpers. Which core: the branch of the same name if
# the core has one, else `develop`. A release pull request (into main) is checked against the core's newest stable tag AND develop, so a release is
# tested against what stable servers run and what is coming.
# Branch protection asks for the jobs named `check` and `index / build` (index.yml); SETUP-FOR-MAINTAINER.md lists the exact names.
name: check
on:
  push:
    branches: [develop, main, "feature/**", "fix/**"]
  pull_request:
env:
  CORE_REPOSITORY: hobnix/core
jobs:
  refs:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.r.outputs.refs }}
      release: ${{ steps.r.outputs.release }}
    steps:
      - id: r
        env:
          GH_REF: ${{ github.head_ref || github.ref_name }}
          RELEASE: ${{ github.base_ref == 'main' }}
        run: |
          url=https://github.com/$CORE_REPOSITORY.git
          if [ "$RELEASE" = true ]; then
            tag=$(git ls-remote --tags --refs "$url" 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -n 1)
            if [ -n "$tag" ]; then refs="[\"$tag\",\"develop\"]"; else refs='["develop"]'; fi
          elif git ls-remote --exit-code --heads "$url" "$GH_REF" >/dev/null 2>&1; then
            refs="[\"$GH_REF\"]"
          else
            refs='["develop"]'
          fi
          echo "refs=$refs" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "core refs: $refs"

  # A pull request carries at most one bump label (hobnix/core#615): `bump: minor` or `bump: major`, none = patch.
  labels:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: At most one bump label
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          n=$(printf '%s' "$LABELS" | tr ',' '\n' | grep -c '^bump: ' || true)
          echo "labels: ${LABELS:-none}"
          [ "$n" -le 1 ] || { echo "::error::more than one bump label: keep one of 'bump: minor' or 'bump: major' (none = patch)"; exit 1; }

  check:
    name: validate (core ${{ matrix.core_ref }})
    needs: refs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core_ref: ${{ fromJSON(needs.refs.outputs.refs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ matrix.core_ref }}
          path: core
      - name: Log the core commit
        run: echo "core $CORE_REPOSITORY@${{ matrix.core_ref }} $(git -C core rev-parse HEAD)"
      - name: Manifests and index
        env:
          RELEASE: ${{ needs.refs.outputs.release }}
        run: |
          # the tree validate reads: recipes as packages/, every extension and capability as capabilities/<name>
          mkdir -p tree/capabilities
          ln -s "$PWD/recipes" tree/packages
          for d in extensions/*/ capabilities/*/; do
            [ -f "$d/package.toml" ] && ln -s "$PWD/${d%/}" "tree/capabilities/$(basename "$d")"
          done
          HS_PACKAGES_ROOT="$PWD/tree" python3 -I core/scripts/pkg.py validate
          if [ "$RELEASE" = true ]; then python3 -I core/scripts/pkg.py repo-check --release .; else python3 -I core/scripts/pkg.py repo-check .; fi
      - name: Shell syntax
        run: for f in recipes/*/*.sh extensions/*/*.sh capabilities/*/*.sh scripts/*.sh tests/*.sh; do [ -f "$f" ] && bash -n "$f"; done; true
      - name: Tools the tests use
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq python3-pil
      - name: Tests (against the core checked out above)
        run: HS_CORE="$PWD/core" HS_TEST_CI=1 bash tests/run-all.sh

  # The release pull request (into main): a package whose folder changed since main needs a higher version in package.toml AND index.toml.
  # There are no tags in this repository: the reference is origin/main (what servers get). The command comes from the core's develop.
  versions:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: develop
          path: core
      - name: Packages changed without a version bump
        run: |
          if ! python3 -I core/scripts/pkg.py repo-unbumped origin/main .; then
            echo "These packages changed since main without a higher version in package.toml and index.toml. Run the workflow prepare-release on develop (or bash <core>/scripts/dev/prepare-release.sh) and merge its pull request first"
            exit 1
          fi

  # The Nix side: every package with a module.nix is vendored into a copy of the core the way `hs pkg install` does it, and the core's matrix
  # evaluates each alone, all of them and none (`nix-matrix.sh --vendor`). It runs when a module, package.toml, options.toml or this file under
  # capabilities/ changed, and always for a release pull request. Not run yet.
  nix:
    needs: [refs, check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core_ref: ${{ fromJSON(needs.refs.outputs.refs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does the Nix matrix have to run?
        id: want
        env:
          RELEASE: ${{ needs.refs.outputs.release }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          want=true
          if [ "$RELEASE" != true ] && [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD | grep -qE '^capabilities/[^/]+/([^/]+\.nix|package\.toml|options\.toml)$|^\.github/workflows/check\.yml$' || want=false
          fi
          echo "run=$want" >> "$GITHUB_OUTPUT"
          echo "nix matrix: $want"
      - uses: actions/checkout@v4
        if: steps.want.outputs.run == 'true'
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ matrix.core_ref }}
          path: core
      - name: Does this core ref have the --vendor matrix?
        id: core_ok
        if: steps.want.outputs.run == 'true'
        run: |
          if [ -f core/scripts/dev/nixpkgs-pin.sh ] && grep -q -- '--vendor' core/scripts/dev/nix-matrix.sh 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Nix matrix skipped::core ref ${{ matrix.core_ref }} has no nixpkgs-pin.sh / nix-matrix.sh --vendor. Not a pass: nothing was evaluated."
            echo "### Nix matrix SKIPPED for core ${{ matrix.core_ref }}: the core ref lacks the --vendor matrix" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Log the core commit and read its nixpkgs pin
        if: steps.core_ok.outputs.run == 'true'
        working-directory: core
        run: |
          echo "core $CORE_REPOSITORY@${{ matrix.core_ref }} $(git rev-parse HEAD)"
          bash scripts/dev/nixpkgs-pin.sh github-env >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: steps.core_ok.outputs.run == 'true'
        with:
          path: ~/nixpkgs.tar.gz
          key: nixpkgs-${{ env.NIXPKGS_REV }}
      - name: Unpack the pinned nixpkgs
        if: steps.core_ok.outputs.run == 'true'
        run: |
          [ -s ~/nixpkgs.tar.gz ] || curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o ~/nixpkgs.tar.gz "https://github.com/NixOS/nixpkgs/archive/$NIXPKGS_REV.tar.gz"
          mkdir -p "$RUNNER_TEMP/nixpkgs"
          tar -xzf ~/nixpkgs.tar.gz -C "$RUNNER_TEMP/nixpkgs" --strip-components=1
          echo "NIXPKGS_DIR=$RUNNER_TEMP/nixpkgs" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@v27
        if: steps.core_ok.outputs.run == 'true'
        with:
          nix_path: nixpkgs=${{ env.NIXPKGS_DIR }}
      - name: Capability matrix with this repository vendored (--vendor)
        if: steps.core_ok.outputs.run == 'true'
        working-directory: core
        run: |
          rm -f machine.toml hardware-configuration.nix
          bash scripts/dev/nix-matrix.sh --vendor "$GITHUB_WORKSPACE"

  # The one result a branch rule can ask for (context `check`). A job that did not have to run counts as fine.
  check-ok:
    name: check
    if: always()
    needs: [refs, labels, check, versions, nix]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
